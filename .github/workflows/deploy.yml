name: Build and Deploy with Docker Compose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker images with Compose
        run: |
          docker compose build
      
      - name: Save images
        run: |
          docker save live_chat:latest -o live_chat.tar
          docker save nginx:latest -o nginx.tar
      
      - name: Setup SSH and Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          # Setup SSH (skip host key verification for CI/CD)
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Disable host key checking
          echo "Host *" > ~/.ssh/config
          echo "    StrictHostKeyChecking no" >> ~/.ssh/config
          echo "    UserKnownHostsFile /dev/null" >> ~/.ssh/config
          
          # Test connection
          echo "🔍 Testing SSH connection..."
          ssh root@$DROPLET_IP "echo '✅ SSH connection successful'"
          
          # Create directory
          echo "📁 Creating directory..."
          ssh root@$DROPLET_IP "mkdir -p /opt/live_chat"
          
          # Copy Docker images
          echo "📦 Copying Docker images..."
          scp live_chat.tar root@$DROPLET_IP:/root/
          scp nginx.tar root@$DROPLET_IP:/root/
          
          # Copy configuration files
          echo "📄 Copying configuration files..."
          scp docker-compose.yml root@$DROPLET_IP:/opt/live_chat/
          scp nginx.conf root@$DROPLET_IP:/opt/live_chat/
          
          # Copy static files
          echo "📁 Copying static files..."
          scp -r ./static root@$DROPLET_IP:/opt/live_chat/ 2>/dev/null || true
          
          # Deploy on Droplet
          echo "🚀 Deploying on Droplet..."
          ssh root@$DROPLET_IP << 'EOF'
            cd /opt/live_chat
            
            # Load Docker images
            echo "📦 Loading Docker images..."
            docker load -i /root/live_chat.tar
            docker load -i /root/nginx.tar
            rm -f /root/live_chat.tar /root/nginx.tar
            
            # Stop and remove old containers
            echo "🛑 Stopping old containers..."
            docker compose down || true
            
            # Start new containers
            echo "🚀 Starting new containers..."
            docker compose up -d
            
            # Clean up unused images
            docker image prune -f
            
            echo "✅ Deployment complete!"
            echo "🌐 App running at http://$DROPLET_IP"
          EOF
      
      - name: Verify deployment
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          sleep 10
          echo "🔍 Checking if app is running..."
          curl -f http://$DROPLET_IP || exit 1
          echo "✅ App is running at http://$DROPLET_IP"