name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t live_chat:${{ github.sha }} .
          docker tag live_chat:${{ github.sha }} live_chat:latest
      
      - name: Save image
        run: docker save live_chat:latest -o live_chat.tar
      
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $DROPLET_IP >> ~/.ssh/known_hosts
      
      - name: Deploy to Droplet
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          ssh -i ~/.ssh/id_ed25519 root@$DROPLET_IP "docker stop chat-app || true && docker rm chat-app || true"
          scp -i ~/.ssh/id_ed25519 live_chat.tar root@$DROPLET_IP:/root/
          ssh -i ~/.ssh/id_ed25519 root@$DROPLET_IP << 'EOF'
            docker load -i /root/live_chat.tar
            docker run -d \
              -p 3030:3030 \
              --name chat-app \
              --restart unless-stopped \
              live_chat:latest
            rm -f /root/live_chat.tar
          EOF
      
      - name: Verify deployment
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          sleep 5
          curl -f http://$DROPLET_IP:3030 || exit 1