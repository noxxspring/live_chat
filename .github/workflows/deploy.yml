name: Build and Deploy with Docker Compose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker images
        run: |
          docker compose build
      
      - name: Save images
        run: |
          docker save live_chat:latest -o live_chat.tar
          docker save nginx:latest -o nginx.tar
      
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $DROPLET_IP >> ~/.ssh/known_hosts
      
      - name: Copy files to Droplet
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          # Copy Docker images
          scp -i ~/.ssh/id_ed25519 live_chat.tar root@$DROPLET_IP:/root/
          scp -i ~/.ssh/id_ed25519 nginx.tar root@$DROPLET_IP:/root/
          
          # Copy docker-compose.yml and nginx.conf
          scp -i ~/.ssh/id_ed25519 docker-compose.yml root@$DROPLET_IP:/opt/live_chat/
          scp -i ~/.ssh/id_ed25519 nginx.conf root@$DROPLET_IP:/opt/live_chat/
          
          # Copy static files (if any changes)
          scp -i ~/.ssh/id_ed25519 -r ./static root@$DROPLET_IP:/opt/live_chat/
      
      - name: Deploy on Droplet
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          ssh -i ~/.ssh/id_ed25519 root@$DROPLET_IP << 'EOF'
            cd /opt/live_chat
            
            # Load Docker images
            docker load -i /root/live_chat.tar
            docker load -i /root/nginx.tar
            rm -f /root/live_chat.tar /root/nginx.tar
            
            # Stop and remove old containers
            docker compose down || true
            
            # Start new containers
            docker compose up -d
            
            # Clean up unused images
            docker image prune -f
            
            echo " Deployment complete!"
          EOF
      
      - name: Verify deployment
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
        run: |
          sleep 5
          curl -f http://$DROPLET_IP || exit 1
          echo " App is running at http://$DROPLET_IP"