services:
  # Your Rust chat application
  live_chat:
    build: .
    image: live_chat:latest
    container_name: live_chat_app
    restart: unless-stopped
    expose:
      - "3030"
    networks:
      - app_network  

  # The Nginx reverse proxy
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80" # Expose HTTP port 80 to the public
    depends_on:
      - live_chat
    networks:
      - app_network

# TOP-LEVEL networks block
networks:
  app_network:
    driver: bridge
