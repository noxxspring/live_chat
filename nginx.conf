# Required for WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. HTTP Server - Redirect everything to HTTPS

server {
    listen 80;
    server_name chat-application.duckdns.org; 

    return 301 https://$host$request_uri;
}

# 2. HTTPS Server - SSL + Reverse Proxy + WebSockets

server {
    listen 443 ssl;
    server_name chat-application.duckdns.org; 

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/chat-application.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-application.duckdns.org/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;


    location / {
        proxy_pass http://live_chat:3030;

        # Standard reverse proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crucial WebSocket support headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeout settings for long-lived WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}